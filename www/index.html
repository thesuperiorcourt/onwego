<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="On We Go">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A reading campaign tracker that behaves like a world instead of a checklist.">
<title>Tonight · On We Go</title>
<style>

   Built to WCAG 2.1 AA: every text colour is checked against the
   surface it actually lands on, colour never carries meaning on
   its own, and nothing needs a mouse.
   Theme packs live in THEMES (see script).
   ============================================================ */

   www/fonts/README.md has the exact source and how to update a version. */

  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}

@font-face{font-family:'Fraunces';font-style:italic;font-weight:400 700;font-display:swap;
  src:url('./fonts/fraunces-italic-latin-ext.woff2') format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:400 700;font-display:swap;
  src:url('./fonts/fraunces-italic-vietnamese.woff2') format('woff2');
  unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB;}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--sky-1);
  color:var(--ink);
  font-family:'Figtree',ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
:root{
  --sky-1:#0A0720; --sky-2:#1D1547; --sky-3:#3B2A6E;
  --ink:#EFE9FF; --muted:#B6A9DE;
  --glow:#F3C56B; --bloom:#F0709E; --leaf:#63C6A3;
  --glow-ink:#F3C56B; --bloom-ink:#F0709E; --leaf-ink:#63C6A3;
  --ground:#150F33; --ground-2:#241A55;
  --card:rgba(10,7,32,.88); --edge:rgba(255,255,255,.16); --edge-strong:#6E63A0;
  --focus:#F3C56B; --btn-ink:#241704;
  --r:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --dock-h:calc(70px + var(--safe-b));
}
h1,h2,h3,h4,.display{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'SOFT' 50,'WONK' 1,'opsz' 96;
  font-weight:600;letter-spacing:-.01em;margin:0;
}
.eyebrow{
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}

/* Focus is never removed, only replaced with something clearer. */
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:14px}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
.skip{
  position:absolute;left:12px;top:-120px;z-index:99;
  background:var(--glow);color:var(--btn-ink);font-weight:700;padding:14px 18px;border-radius:0 0 14px 14px;
  text-decoration:none;
}
.skip:focus{top:0}

/* ---------------------------------------------------- app frame */
#app{min-height:100%;display:flex;flex-direction:column}
#main:focus{outline:none}
.screen{flex:1;padding-bottom:calc(var(--dock-h) + 20px);animation:rise .45s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{padding:0 18px;max-width:560px;margin:0 auto}
.page-title{font-size:28px}

/* ---------------------------------------------------- the scene */
.scene{position:relative;height:46vh;min-height:290px;max-height:420px;overflow:hidden}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .veil{
  position:absolute;left:0;right:0;bottom:0;height:38%;
  background:linear-gradient(to bottom,transparent,var(--sky-1) 92%);pointer-events:none;
}
.scene-cap{position:absolute;left:18px;right:18px;top:calc(14px + var(--safe-t));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.worldbtn,.counter{
  background:var(--card);border:1px solid var(--edge-strong);border-radius:999px;
  backdrop-filter:blur(8px);min-height:44px;padding:9px 15px;
}
.worldbtn{display:flex;align-items:center;gap:8px}
.worldbtn b{font-family:'Fraunces',serif;font-weight:600;font-size:15px}
.worldbtn small,.counter small{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.counter{text-align:right}
.counter b{display:block;font-family:'Fraunces',serif;font-size:19px;line-height:1.15;color:var(--glow-ink)}

.mote{position:absolute;border-radius:50%;opacity:.5;filter:blur(.4px);animation:drift linear infinite;pointer-events:none}
@keyframes drift{
  0%{transform:translate3d(0,0,0);opacity:0}
  15%{opacity:.65}
  85%{opacity:.5}
  100%{transform:translate3d(24px,-90px,0);opacity:0}
}

/* ---------------------------------------------------- cards */
.card{
  background:var(--card);border:1px solid var(--edge);border-radius:var(--r);
  padding:20px;backdrop-filter:blur(14px);
}
.quest{margin-top:-46px;position:relative;z-index:2;box-shadow:0 24px 60px -30px rgba(0,0,0,.9)}
.quest .date{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.quest .stars{color:var(--glow-ink);letter-spacing:2px;font-size:13px}
.quest h1{font-size:clamp(27px,7.4vw,36px);line-height:1.05;margin:8px 0 14px;font-variation-settings:'SOFT' 50,'WONK' 1,'opsz' 144;font-weight:700}
.target{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--edge-strong);
}
.target b{font-family:'Fraunces',serif;font-size:22px;color:var(--glow-ink)}
.target span{color:var(--muted);font-size:13.5px}

.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tier{
  border:1px solid var(--edge-strong);border-radius:16px;padding:12px 8px;text-align:center;
  background:transparent;min-height:92px;transition:transform .15s,border-color .2s,background .2s;
}
.tier:active{transform:scale(.96)}
.tier b{display:block;font-family:'Fraunces',serif;font-size:15px}
.tier small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.tier .pay{display:block;margin-top:7px;font-size:12px;color:var(--glow-ink);letter-spacing:.03em}
.tier .impact{display:block;margin-top:5px;font-size:11.5px;color:var(--muted);line-height:1.25}
.tier[aria-pressed="true"]{border-color:var(--leaf-ink);border-width:2px}
.tier[aria-pressed="true"] b::before{content:'✓ '}

.bait{margin-top:14px}
.bait-btn{
  width:100%;text-align:left;padding:15px 16px;border-radius:16px;min-height:52px;
  border:1px dashed var(--edge-strong);background:transparent;
  display:flex;align-items:center;gap:10px;color:var(--glow-ink);font-weight:600;font-size:14.5px;
}
.bait-open{
  padding:15px 16px;border-radius:16px;background:var(--card);
  border:1px solid var(--edge-strong);animation:rise .4s ease;
}
.bait-open p{margin:0;font-family:'Fraunces',serif;font-size:17px;line-height:1.4;font-variation-settings:'SOFT' 50,'WONK' 1,'opsz' 60}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{
  font-size:12.5px;padding:8px 12px;border-radius:999px;
  background:transparent;border:1px solid var(--edge-strong);color:var(--muted);
  display:inline-flex;align-items:center;
}
button.chip{min-height:44px;padding:8px 14px}
button.chip[aria-pressed="true"]{border-color:var(--glow-ink);border-width:2px;color:var(--ink)}
button.chip[aria-pressed="true"]::after{content:' ✓';color:var(--glow-ink)}
.chip b{color:var(--ink);font-weight:600}

.momentum{margin-top:18px}
.bar{height:10px;border-radius:99px;background:rgba(127,127,127,.32);overflow:hidden;margin-top:7px;border:1px solid var(--edge)}
.bar i{display:block;height:100%;border-radius:99px;background:var(--glow-ink);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.momentum .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--muted)}
.momentum .row b{color:var(--ink);font-weight:600}

.escape{
  margin-top:14px;width:100%;text-align:left;padding:16px;border-radius:18px;
  background:transparent;border:1px solid var(--edge-strong);
}
.escape b{display:block;font-family:'Fraunces',serif;font-size:16.5px;color:var(--bloom-ink)}
.escape small{color:var(--muted);font-size:13px;line-height:1.5;display:block;margin-top:4px}

/* ---------------------------------------------------- sections */
.sec{margin-top:26px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:21px}
.link{font-size:13.5px;color:var(--glow-ink);font-weight:600;padding:10px 4px;min-height:44px;display:inline-flex;align-items:center}

/* ---------------------------------------------------- campaign map */
.trail{position:relative;padding-left:34px;list-style:none;margin:0}
.trail::before{content:'';position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--edge-strong)}
.node{position:relative;padding:12px 0}
.node::before{
  content:'';position:absolute;left:-28px;top:18px;width:12px;height:12px;border-radius:50%;
  background:var(--sky-1);border:2px solid var(--edge-strong);
}
.node.done::before{background:var(--leaf-ink);border-color:var(--leaf-ink)}
.node.today::before{background:var(--glow-ink);border-color:var(--glow-ink);box-shadow:0 0 0 5px rgba(127,127,127,.28)}
.node .d{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.node h3{font-size:16px;margin:2px 0 3px;font-variation-settings:'SOFT' 50,'WONK' 1,'opsz' 40}
.node p{margin:0;font-size:13.5px;color:var(--muted)}
.node .res{font-size:12px;color:var(--leaf-ink);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.node .res.now{color:var(--glow-ink)}
.realm-head{
  margin:22px 0 6px;padding:14px 16px;border-radius:18px;
  background:var(--card);border:1px solid var(--edge-strong);
}
.realm-head h2{font-size:18px}
.realm-head small{color:var(--muted);font-size:12.5px}

/* ---------------------------------------------------- hoard */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--edge)}
.stat b{display:block;font-family:'Fraunces',serif;font-size:26px;line-height:1.15;color:var(--glow-ink)}
.stat small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.loot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;list-style:none;padding:0;margin:0}
.loot{
  border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;text-align:center;padding:12px 8px;background:var(--card);border:1px solid var(--edge-strong);
}
.loot .g{font-size:24px;line-height:1}
.loot .n{font-size:12px;font-weight:600;line-height:1.25}
.loot small{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.loot.rare{border-color:var(--leaf-ink)}
.loot.epic{border-color:var(--bloom-ink)}
.loot.legendary{border-color:var(--glow-ink);border-width:2px}

.shelf{display:flex;flex-direction:column;gap:9px;list-style:none;padding:0;margin:0}
.row-item{
  display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:18px;min-height:56px;
  background:var(--card);border:1px solid var(--edge);text-align:left;width:100%;
}
.row-item .g{font-size:21px;flex:none}
.row-item .t{flex:1;min-width:0}
.row-item .t b{display:block;font-size:15px;font-weight:600}
.row-item .t small{color:var(--muted);font-size:12.5px;display:block;line-height:1.4}
.row-item .bar{margin-top:8px;height:7px}
.row-item[aria-pressed="true"]{border-color:var(--glow-ink);border-width:2px}
.row-item .price{color:var(--glow-ink);font-weight:700;font-size:14px;white-space:nowrap}
.row-item.locked{border-style:dashed}
.row-item.claimed{border-color:var(--leaf-ink);border-width:2px}
.ach.got{border-color:var(--glow-ink)}

/* ---------------------------------------------------- focus mode */
.sprint{
  display:flex;align-items:center;gap:14px;width:100%;padding:17px 16px;border-radius:20px;
  background:var(--card);border:1px solid var(--edge-strong);text-align:left;min-height:64px;
}
.sprint .g{font-size:26px}
.sprint b{display:block;font-family:'Fraunces',serif;font-size:17px}
.sprint small{color:var(--muted);font-size:13px}

.timer-face{text-align:center;padding:20px 0 10px;position:relative}
.timer-face .t{
  font-family:'Fraunces',serif;font-size:60px;line-height:1;font-variation-settings:'opsz' 144;
  color:var(--glow-ink);font-variant-numeric:tabular-nums;
  position:absolute;left:0;right:0;top:50%;transform:translateY(-56%);
}
.ring{width:190px;height:190px;margin:0 auto;display:block}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:rgba(127,127,127,.34)}
.ring .fg{stroke:var(--glow-ink);transition:stroke-dashoffset 1s linear;transform:rotate(-90deg);transform-origin:50% 50%}

/* ---------------------------------------------------- dock */
.dock{
  position:fixed;left:0;right:0;bottom:0;height:var(--dock-h);padding-bottom:var(--safe-b);
  display:flex;background:var(--card);backdrop-filter:blur(18px);
  border-top:1px solid var(--edge-strong);z-index:40;
}
.dock button{
  position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;min-height:56px;
}
.dock button .g{font-size:20px;line-height:1}
.dock button[aria-current="page"]{color:var(--glow-ink);font-weight:700}
.dock button[aria-current="page"]::after{
  content:'';position:absolute;bottom:6px;width:22px;height:3px;border-radius:9px;background:var(--glow-ink);
}

/* ---------------------------------------------------- sheets & modals */
.veilbg{position:fixed;inset:0;background:rgba(5,3,18,.74);backdrop-filter:blur(4px);z-index:50;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;overflow:auto;
  background:var(--sky-1);
  border-top-left-radius:28px;border-top-right-radius:28px;border-top:1px solid var(--edge-strong);
  padding:10px 18px calc(28px + var(--safe-b));animation:up .35s cubic-bezier(.2,.8,.25,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--edge-strong);margin:6px auto 6px}
.sheet-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.close{
  width:44px;height:44px;border-radius:999px;border:1px solid var(--edge-strong);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;
}
.sheet h2{font-size:23px;margin-bottom:4px}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.err{color:var(--bloom-ink);font-size:14px;font-weight:600;margin:0 0 12px}

.drop{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:26px;
  background:rgba(5,3,18,.92);animation:fade .3s ease;
}
.drop-card{
  text-align:center;padding:34px 26px;border-radius:28px;max-width:340px;width:100%;
  background:var(--sky-1);border:2px solid var(--glow-ink);animation:pop .5s cubic-bezier(.2,1.3,.4,1);
}
@keyframes pop{0%{transform:scale(.7) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
.drop-card .g{font-size:62px;display:block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.drop-card h2{font-size:26px;margin:12px 0 6px}
.drop-card .rarity{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--glow-ink);font-weight:700}
.drop-card p{color:var(--muted);font-size:14.5px;margin:10px 0 20px}

.btn{
  display:block;width:100%;padding:16px;border-radius:16px;text-align:center;font-weight:700;font-size:15.5px;
  background:var(--glow);color:var(--btn-ink);min-height:52px;border:1px solid transparent;
}
.btn.ghost{background:transparent;border-color:var(--edge-strong);color:var(--ink)}
.btn.line{background:transparent;border-color:var(--edge-strong);color:var(--muted);font-weight:600;font-size:14px}
.btn+.btn{margin-top:9px}

label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
label.f .hint{text-transform:none;letter-spacing:0;font-size:12.5px}
input,select,textarea{
  width:100%;padding:14px;border-radius:14px;background:transparent;
  border:1px solid var(--edge-strong);color:var(--ink);font:inherit;font-size:16px;min-height:52px;
}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input[type=date]{-webkit-appearance:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap;list-style:none;padding:0;margin:0}
.sw{
  width:84px;min-height:84px;border-radius:18px;border:2px solid var(--edge-strong);position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:8px;
}
.sw[aria-pressed="true"]{border-color:var(--focus);border-width:3px}
.sw .n{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.95)}
.sw .dot{position:absolute;top:14px;width:16px;height:16px;border-radius:50%}
.sw .on{position:absolute;top:7px;right:9px;font-size:14px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.95)}

.empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:14.5px}
.empty b{display:block;font-family:'Fraunces',serif;font-size:19px;color:var(--ink);margin-bottom:6px}

#live{position:fixed;left:50%;bottom:calc(var(--dock-h) + 16px);transform:translateX(-50%);z-index:70;pointer-events:none;display:flex;justify-content:center}
.toast{
  padding:13px 18px;border-radius:99px;background:var(--sky-1);border:1px solid var(--edge-strong);
  font-size:14px;font-weight:600;animation:rise .3s ease;max-width:92vw;text-align:center;
}

/* Motion: the system preference, or the switch in Settings. */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .mote{display:none}
}
html.calm *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
html.calm .mote{display:none}

@media (forced-colors:active){
  .card,.tier,.row-item,.chip,.btn,.sheet,.drop-card,.sw{border:1px solid CanvasText}
  .bar i{background:Highlight}
}
</style>

/* ------------------------------ error reports ------------------------------
   Reports a JS error's message, stack and where it happened — nothing about
   what the person was doing, no app state, no task titles. Works signed out,
   since the app has to. Best-effort: a failed report never surfaces to the
   user, and the same error is only sent once per page load so a loop of the
   same failure can't spam the endpoint. */
(function () {
  const seen = new Set();
  let sent = 0;
  function report(message, stack) {
    if (!message || sent >= 20) return;
    const key = message + '|' + (stack || '').slice(0, 200);
    if (seen.has(key)) return;
    seen.add(key); sent++;
    const base = (window.ONWEGO_CONFIG && window.ONWEGO_CONFIG.apiBase) || '';
    try {
      fetch(base + '/api/error', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ message: String(message).slice(0, 500), stack: stack ? String(stack).slice(0, 2000) : undefined })
      }).catch(() => {});
    } catch (e) {}
  }
  window.addEventListener('error', e => report(e.message, e.error && e.error.stack));
  window.addEventListener('unhandledrejection', e => {
    const r = e.reason;
    report(r && r.message ? r.message : String(r), r && r.stack);
  });
})();

/* ---------- storage: artifact sandbox OR plain browser (Netlify) ---------- */
const Store = {
  key: 'onwego.v1',
  legacy: ['questline.v1'],          /* earlier name — read once, then migrated */
  async load() {
    for (const k of [this.key, ...this.legacy]) {
      try {
        if (window.storage) {
          const r = await window.storage.get(k);
          if (r && r.value) return JSON.parse(r.value);
          continue;
        }
      } catch (e) { /* key absent in sandbox */ }
      try {
        const v = localStorage.getItem(k);
        if (v) return JSON.parse(v);
      } catch (e) { return null; }
    }
    return null;
  },
  async save(data) {
    const s = JSON.stringify(data);
    try {
      if (window.storage) { await window.storage.set(this.key, s); return; }
    } catch (e) { /* fall through */ }
    try { localStorage.setItem(this.key, s); } catch (e) {}
  }
};

/* --------------------------------- dates ---------------------------------- */
const iso = d => d.toISOString().slice(0,10);
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => iso(new Date(Date.now() - new Date().getTimezoneOffset()*60000));
const fmtDay = s => parseISO(s).toLocaleDateString(undefined,{ month:'short', day:'numeric' }).toUpperCase();
const fmtLong = s => parseISO(s).toLocaleDateString(undefined,{ weekday:'long', month:'long', day:'numeric' });
const daysBetween = (a,b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);

/* ------------------------------ world engine -------------------------------
   A world is a campaign of ordered units (chapters, episodes, lessons…)
   spread across dates. Everything else — bait, milestones, the grove — hangs
   off the unit index, so falling behind never invalidates the story.        */

function unitLabel(w, globalIdx) {
  let n = globalIdx;
  for (const b of w.books) {
    if (n < b.units) {
      if (b.labels) return b.labels[n];
      if (n === 0 && b.first && b.first !== 'Ch. 1') return b.first;
      if (n === b.units - 1 && b.last) return b.last;
      const off = (b.first === 'Prologue') ? 0 : parseInt(String(b.first).replace(/\D/g,''), 10) || 1;
      return 'Ch. ' + (b.first === 'Prologue' ? n : n + off);
    }
    n -= b.units;
  }
  return '—';
}
function bookAt(w, globalIdx) {
  let n = globalIdx;
  for (const b of w.books) { if (n < b.units) return b; n -= b.units; }
  return w.books[w.books.length - 1];
}
function bookOffset(w, bookId) {
  let n = 0;
  for (const b of w.books) { if (b.id === bookId) return n; n += b.units; }
  return 0;
}
function totalUnits(w) { return w.books.reduce((s,b) => s + b.units, 0); }

function baitFor(w, fromGlobal, toGlobal) {
  const bk = bookAt(w, fromGlobal), off = bookOffset(w, bk.id);
  const a = fromGlobal - off, z = toGlobal - off;
  let best = null;
  (w.baits || []).forEach(band => {
    if (band.b !== bk.id) return;
    if (z < band.a || a > band.z) return;
    if (!best || band.s > best.s) best = band;
  });
  return best || { t:'Distance night. No cliff, no wall — just pages behind you.', s:0 };
}

/* Attach global unit indexes to the shipped plan (first run only). */
function indexDays(w) {
  let cursor = 0;
  w.days.forEach(d => {
    d.fromGlobal = cursor;
    d.toGlobal = cursor + d.goal - 1;
    cursor += d.goal;
  });
}

function dayFor(w, date) { return w.days.find(d => d.date === date) || null; }

function levelFor(xp) {
  let idx = 0;
  LEVELS.forEach((l, i) => { if (xp >= l.at) idx = i; });
  const next = LEVELS[idx + 1];
  return {
    n: idx + 1, name: LEVELS[idx].name, at: LEVELS[idx].at,
    nextAt: next ? next.at : null,
    pct: next ? (xp - LEVELS[idx].at) / (next.at - LEVELS[idx].at) : 1
  };
}

function rollLoot(guaranteedRarity) {
  let rarity = guaranteedRarity;
  if (!rarity) {
    const roll = Math.random(); let acc = 0;
    for (const [r, w] of Object.entries(RARITY_W)) { acc += w; if (roll <= acc) { rarity = r; break; } }
    rarity = rarity || 'common';
  }
  const pool = LOOT.filter(l => l.r === rarity);
  const item = pool[Math.floor(Math.random() * pool.length)];
  return { ...item, at: Date.now() };
}

function newProgress() {

           shop: DEFAULT_SHOP.map(s => ({...s})), claimed:[], sprints:0, sprintMinutes:0 };
}

function makeWorld(spec) {
  /* spec: {name, unit, unitPlural, currency, theme, start, end, launch, launchLabel, parts:[{name,units}]} */
  const id = 'w' + Date.now().toString(36);
  const books = spec.parts.map((p, i) => ({
    id: 'p' + i, title: p.name, short: p.name.slice(0, 3).toUpperCase(),
    realm: p.name, units: p.units, first: 'Ch. 1', last: 'Ch. ' + p.units, startNote: 'From the top'
  }));
  const dates = [];
  for (let d = parseISO(spec.start); iso(d) <= spec.end; d.setDate(d.getDate() + 1)) dates.push(iso(d));
  const total = books.reduce((s,b) => s + b.units, 0);
  const per = total / dates.length;
  const titles = ['OPENING MOVE','FIND THE RHYTHM','KEEP THE THREAD','QUIET PROGRESS','THE MIDDLE IS THE TRAP',
                  'PAST HALFWAY','MOMENTUM','THE TURN','CLOSING IN','FINAL APPROACH','LAST STRETCH','FINISH IT'];
  let cursor = 0, acc = 0;
  const days = dates.map((date, i) => {
    acc += per;
    let take = Math.round(acc) - cursor;
    if (i === dates.length - 1) take = total - cursor;
    const from = cursor; cursor += take;
    let acc2 = 0, bid = books[0].id;
    for (const b of books) { if (from < acc2 + b.units) { bid = b.id; break; } acc2 += b.units; }
    return { date, book: bid, title: titles[i % titles.length], goal: take,
             minWin: Math.min(2, take), stars: 0, mode: 'Whatever works', speed: '—' };
  });
  const baits = [];
  books.forEach(b => {
    const marks = [0, .12, .3, .5, .72, .9, 1];
    const texts = [
      ['Opening stretch. Only job: get back into it.', 1],
      ['The setup stops being setup here.', 0],
      ['Rhythm section. Distance covered, nothing dramatic.', 0],
      ['Midpoint. The pile behind you is bigger than the pile ahead.', 1],
      ['This is the part that goes fast.', 1],
      ['Final approach. You already know you\'re finishing.', 3]
    ];
    for (let i = 0; i < marks.length - 1; i++) {
      const a = Math.floor(marks[i]*b.units), z = Math.max(a, Math.floor(marks[i+1]*b.units) - 1);
      baits.push({ b:b.id, a, z, t:texts[i][0], s:texts[i][1] });
    }
  });
  const BIOMES = ['gatefield','lunathion','eternal','beneath','grove'];
  const milestones = books.map((b, i) => ({
    id: 'ms' + i, book: b.id, atUnit: 'end', atIndex: b.units - 1,
    name: b.title + ' — done', blurb: 'One more finished thing.',
    reward: i === books.length - 1 ? 'legendary' : 'biome', biome: BIOMES[i % BIOMES.length], icon:'crown'
  }));
  return {
    id, name: spec.name, tagline: spec.tagline || '', unit: spec.unit || 'chapter',
    unitPlural: spec.unitPlural || (spec.unit ? spec.unit + 's' : 'chapters'),
    currency: spec.currency || 'Coins', xpName: 'XP', theme: spec.theme || 'meadow',
    start: spec.start, end: spec.end, launch: spec.launch || '', launchLabel: spec.launchLabel || '',
    books, days, baits, milestones, progress: newProgress()
  };
}

/* seeded noise so the sky and the grove look the same every time you open it */
function mulberry(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ------------------------------ the scene --------------------------------- */
function floraSVG(f, th, x, y, seed, scale) {
  const r = mulberry(seed);
  const c = th.canopy[Math.floor(r() * th.canopy.length)];
  const s = (scale || 1) * (f.kind === 'legendary' ? 1.6 : f.kind === 'bloom' ? 1.15 : f.kind === 'tree' ? 1 : .62);
  const g = [];
  g.push(`<g transform="translate(${x} ${y}) scale(${s.toFixed(2)})">`);
  if (f.kind === 'sprout') {
    g.push(`<path d="M0 0 L0 -13" stroke="${th.trunk}" stroke-width="2.4" stroke-linecap="round"/>`);
    g.push(`<ellipse cx="-5" cy="-12" rx="6" ry="3.4" fill="${c}" transform="rotate(-24 -5 -12)"/>`);
    g.push(`<ellipse cx="5" cy="-15" rx="6" ry="3.4" fill="${c}" transform="rotate(24 5 -15)"/>`);
  } else {
    const h = 22 + r() * 8;
    g.push(`<path d="M0 0 L0 ${-h}" stroke="${th.trunk}" stroke-width="3.4" stroke-linecap="round"/>`);
    if (f.kind === 'legendary') g.push(`<circle cx="0" cy="${-h - 12}" r="26" fill="${th.bloomDot}" opacity=".18"/>`);
    g.push(`<circle cx="0" cy="${-h - 10}" r="13" fill="${c}"/>`);
    g.push(`<circle cx="-10" cy="${-h - 3}" r="9.5" fill="${c}" opacity=".92"/>`);
    g.push(`<circle cx="10" cy="${-h - 4}" r="9" fill="${c}" opacity=".92"/>`);
    if (f.kind === 'bloom' || f.kind === 'legendary') {
      for (let i = 0; i < (f.kind === 'legendary' ? 7 : 4); i++) {
        g.push(`<circle cx="${(r()*26-13).toFixed(1)}" cy="${(-h-14+r()*16).toFixed(1)}" r="2.1" fill="${th.bloomDot}"/>`);
      }
    }
    if (f.kind === 'legendary') g.push(`<path d="M0 ${-h-27} l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="${th.bloomDot}"/>`);
  }
  g.push('</g>');
  return g.join('');
}

function sceneSVG(opts) {
  const th = THEMES[W.theme] || THEMES.midnight;
  const pct = campaignPct();
  const flora = (W.progress.flora || []).slice(-(opts.max || 16));
  const H = 300, GY = 232;
  const p = [];
  p.push(`<svg viewBox="0 0 400 ${H}" preserveAspectRatio="xMidYMax slice" aria-hidden="true">`);
  p.push(`<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${th.vars['--sky-1']}"/>
      <stop offset="55%" stop-color="${th.vars['--sky-2']}"/>
      <stop offset="100%" stop-color="${th.vars['--sky-3']}"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0%" stop-color="${th.vars['--glow']}" stop-opacity=".55"/><stop offset="100%" stop-color="${th.vars['--glow']}" stop-opacity="0"/></radialGradient>
  </defs>`);
  p.push(`<rect width="400" height="${H}" fill="url(#sky)"/>`);

  const r = mulberry(9421);
  for (let i = 0; i < th.sky.stars; i++) {
    const x = r() * 400, y = r() * (GY - 60), rad = r() * 1.3 + .5, o = (.35 + r() * .6).toFixed(2);
    p.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${th.vars['--ink']}" opacity="${o}"/>`);
  }

  if (th.sky.moon) {

    p.push(`<circle cx="${mx}" cy="${my}" r="${mr + 26}" fill="url(#halo)"/>`);
    p.push(`<circle cx="${mx}" cy="${my}" r="${mr}" fill="${th.vars['--glow']}"/>`);

    p.push(`<circle cx="${mx}" cy="${my}" r="${mr}" fill="none" stroke="${th.vars['--glow']}" stroke-width="1" opacity=".5"/>`);
  }

  if (th.sky.sun === 'rising') {
    const sy = GY + 46 - pct * 62;
    p.push(`<circle cx="86" cy="${sy.toFixed(1)}" r="70" fill="url(#halo)" opacity=".7"/>`);
    p.push(`<circle cx="86" cy="${sy.toFixed(1)}" r="24" fill="${th.vars['--glow']}" opacity=".9"/>`);
  } else if (th.sky.sun === 'high') {
    p.push(`<circle cx="312" cy="58" r="64" fill="url(#halo)"/><circle cx="312" cy="58" r="27" fill="${th.vars['--glow']}"/>`);
  } else if (th.sky.sun === 'setting') {
    p.push(`<circle cx="300" cy="176" r="78" fill="url(#halo)"/><circle cx="300" cy="176" r="30" fill="${th.vars['--glow']}" opacity=".92"/>`);
  }
  for (let i = 0; i < th.sky.clouds; i++) {
    const cx = 40 + i * 130 + r() * 40, cy = 50 + r() * 46;
    p.push(`<g opacity=".5" fill="${th.vars['--ink']}"><ellipse cx="${cx}" cy="${cy}" rx="30" ry="12"/><ellipse cx="${cx+20}" cy="${cy-6}" rx="20" ry="11"/><ellipse cx="${cx-20}" cy="${cy-3}" rx="17" ry="9"/></g>`);
  }
  /* land */
  p.push(`<path d="M0 ${GY-16} Q70 ${GY-40} 150 ${GY-18} T400 ${GY-30} L400 ${H} L0 ${H} Z" fill="${th.vars['--ground-2']}" opacity=".85"/>`);
  p.push(`<path d="M0 ${GY} Q110 ${GY-14} 230 ${GY+4} T400 ${GY-6} L400 ${H} L0 ${H} Z" fill="${th.vars['--ground']}"/>`);

  flora.forEach((f, i) => {
    const rr = mulberry(f.seed || i * 977);
    const x = 24 + ((i * 47 + (f.seed || 0) % 23) % 356);
    const y = GY + 6 + rr() * 34;
    p.push(floraSVG(f, th, x, y, f.seed || i * 331, .82 + rr() * .3));
  });
  p.push('</svg>');
  return p.join('');
}

function motes() {
  const th = THEMES[W.theme] || THEMES.midnight;
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (calm) return '';
  const r = mulberry(77);
  let out = '';
  for (let i = 0; i < 9; i++) {
    const size = (2 + r() * 3).toFixed(1), left = (r() * 100).toFixed(1),
          top = (55 + r() * 40).toFixed(1), dur = (6 + r() * 8).toFixed(1), del = (r() * 8).toFixed(1);
    const color = th.sky.motes === 'bubble' ? th.vars['--leaf'] : th.sky.motes === 'petal' ? th.vars['--bloom'] : th.vars['--glow'];
    out += `<i class="mote" style="width:${size}px;height:${size}px;left:${left}%;top:${top}%;animation-duration:${dur}s;animation-delay:${del}s;background:${color}"></i>`;
  }
  return out;
}

/* ------------------------------- derived ---------------------------------- */
function campaignPct() { return Math.min(1, W.progress.unitsDone / totalUnits(W)); }
function streak() {
  /* A streak day is any day something streak-eligible was logged. Skipping
     never zeroes it — it just stops adding. */
  const days = new Set();
  Object.keys(W.progress.log).forEach(id => {
    const l = W.progress.log[id];
    if (!l || l.result === 'skip') return;
    const task = (W.tasks || []).find(t => t.id === id);
    if (task && task.streak === false) return;
    days.add(l.date || id);
  });
  let n = 0, d = today();
  if (!days.has(d)) d = iso(new Date(parseISO(d).getTime() - 86400000));
  while (days.has(d)) { n++; d = iso(new Date(parseISO(d).getTime() - 86400000)); }
  return n;
}
function nextMilestone() {
  const done = W.progress.unitsDone;
  return (W.milestones || []).map(m => ({...m})).filter(m => m.atIndex >= done)
    .sort((a,b) => a.atIndex - b.atIndex)[0] || null;
}
function daysLeft() {
  const t = today();
  return Math.max(0, W.days.filter(d => d.date >= t).length);
}

function migrateTasks(w) {
  if (!w.home) w.home = defaultHome();
  if (w.tasks) return;
  w.tasks = (w.days || []).map(d => {
    const bait = baitFor(w, d.fromGlobal, d.toGlobal);
    const bk = w.books.find(b => b.id === d.book) || {};
    const from = unitLabel(w, d.fromGlobal), to = unitLabel(w, d.toGlobal);
    const tags = [];
    if (Math.max(bait.s, d.stars || 0) >= 2) tags.push('starred');
    return newTask({
      id: 't_' + d.date,
      title: d.title, date: d.date,
      category: bk.title || '', subcategory: bk.realm || '',
      tags, streak: true, types: ['target','streak'], planMax: d.goal || null,
      min: d.minWin || null, max: d.goal || null,
      range: from + (from !== to ? ' – ' + to : ''),

      payoff: '', notes: '',

    });

function taskCategories(w) {

function isLogged(w, t) { const l = w.progress.log[t.id]; return !!(l && l.result !== 'skip'); }

function filterTasks(w, o) {
  const t0 = today();
  let list = (w.tasks || []).slice();
  if (o.q) {
    const q = o.q.toLowerCase();
    list = list.filter(t => [t.title,t.category,t.subcategory,t.hook,t.how,t.payoff,t.notes,t.range]
      .concat(t.tags || []).join(' ').toLowerCase().includes(q));
  }
  if (o.categories && o.categories.length) list = list.filter(t => o.categories.includes(t.category));
  if (o.tags && o.tags.length) list = list.filter(t => (t.tags || []).some(x => o.tags.includes(x)));
  if (o.streakOnly) list = list.filter(t => t.streak);
  if (o.scope === 'today')    list = list.filter(t => t.date === t0);
  if (o.scope === 'upcoming') list = list.filter(t => !t.date || t.date >= t0);
  if (o.scope === 'open')     list = list.filter(t => !isLogged(w, t));
  if (o.scope === 'done')     list = list.filter(t => isLogged(w, t));
  const dir = o.dir === 'desc' ? -1 : 1;
  const key = o.sort || 'date';
  list.sort((a,b) => {
    let x = a[key], y = b[key];
    if (key === 'min' || key === 'max' || key === 'added') { x = x || 0; y = y || 0; return (x - y) * dir; }
    x = (x || '').toString().toLowerCase(); y = (y || '').toString().toLowerCase();
    if (key === 'date') { if (!x) return 1; if (!y) return -1; }
    return x < y ? -dir : x > y ? dir : 0;
  });
  return list;
}

/* ============================================================
   TRACKS — what happens to everything else when you log a result.

   A track owns one or more categories and holds a total to finish.
   One thing about it is pinned down, and logging moves the other:

     anchor 'deadline' → the date holds, the amounts move
     anchor 'pace'     → the amounts hold, the finish date moves
     anchor 'none'     → nothing is rewritten, you just get a forecast

   How the difference lands is a second choice:

     ripple 'smooth'  → spread it evenly over everything left
     ripple 'consume' → amounts stay put, the dates slide
     ripple 'fixed'   → nothing is rewritten; surplus banks as "ahead"
   ============================================================ */

const TASK_TYPES = [
  { k:'target',    label:'Target',    hint:'Has amounts and moves a track forward' },
  { k:'streak',    label:'Streak',    hint:'Logging it keeps the streak alive' },
  { k:'repeating', label:'Repeating', hint:'Comes back on a schedule' },
  { k:'anytime',   label:'Anytime',   hint:'No date, never late' },
  { k:'milestone', label:'Milestone', hint:'No work — marks a moment' },
  { k:'bonus',     label:'Bonus',     hint:'Earns XP but never changes the pace' }
];

const REPEATS = [
  { k:'',        label:"Doesn't repeat" },
  { k:'daily',   label:'Every day' },
  { k:'weekdays',label:'Weekdays' },
  { k:'weekly',  label:'Every week' },
  { k:'everyN',  label:'Every N days' }
];

const ANCHORS = [
  { k:'deadline', label:'The end date holds', hint:'Amounts on future tasks move instead' },
  { k:'pace',     label:'The amount holds',   hint:'The finish date moves instead' },
  { k:'none',     label:'Nothing is pinned',  hint:'Just show me the forecast' }
];

const RIPPLES = [
  { k:'smooth',  label:'Smooth',  hint:'Spread the difference over everything left' },
  { k:'consume', label:'Consume', hint:'Amounts stay; the dates slide' },
  { k:'fixed',   label:'Fixed',   hint:'Never rewrite — bank it as ahead or behind' }
];

const addDays = (isoStr, n) => iso(new Date(parseISO(isoStr).getTime() + n * 86400000));

function hasType(t, k) { return (t.types || []).includes(k); }

function newTrack(over) {
  return Object.assign({
    id: 'tr' + Date.now().toString(36), name:'New track', categories:[],
    total: 100, mode:'count', anchor:'deadline', endDate:'', pace:5,
    ripple:'smooth', comfort:null, basePace:null
  }, over || {});
}

function trackTasks(w, tr) {
  return (w.tasks || []).filter(t => hasType(t, 'target') &&
    (!tr.categories.length || tr.categories.includes(t.category)));
}
function trackFor(w, task) {
  if (!hasType(task, 'target')) return null;
  return (w.tracks || []).find(tr => !tr.categories.length || tr.categories.includes(task.category)) || null;
}
function trackDone(w, tr) {
  return trackTasks(w, tr).reduce((s,t) => {
    const l = w.progress.log[t.id];
    return s + (l && l.result !== 'skip' ? (l.units || 0) : 0);
  }, 0);
}
function openSlots(w, tr) {
  const t0 = today();
  return trackTasks(w, tr)
    .filter(t => !w.progress.log[t.id])
    .filter(t => !t.date || t.date >= t0)
    .sort((a,b) => (a.date || '9999') < (b.date || '9999') ? -1 : 1);
}

/* Past-dated, unlogged, not yet acknowledged — openSlots() has already
   excluded these from the future, silently. This is what makes them visible
   again so a missed day gets a decision instead of disappearing. */
function missedTasks(w, tr) {
  const t0 = today();
  return trackTasks(w, tr)
    .filter(t => !w.progress.log[t.id] && !t.missedAck)
    .filter(t => t.date && t.date < t0)
    .sort((a,b) => (a.date < b.date ? -1 : 1));
}

/* Everything the Tonight screen and the Tracks list need to say out loud. */
function trackStatus(w, tr) {
  const done = trackDone(w, tr);
  const remaining = Math.max(0, tr.total - done);
  const slots = openSlots(w, tr);
  const perSlot = slots.length ? remaining / slots.length : 0;
  const pace = tr.anchor === 'pace' ? (tr.pace || 1) : perSlot;
  const daysNeeded = pace > 0 ? Math.ceil(remaining / pace) : 0;
  const active = slots.filter(t => (t.max || 0) > 0);
  const tail = active.length ? active : slots;
  const projectedEnd = tr.anchor === 'pace'
    ? (remaining ? addDays(today(), Math.max(0, daysNeeded - 1)) : today())
    : (tail.length ? tail[tail.length - 1].date : tr.endDate);
  const comfort = tr.comfort || (tr.basePace ? tr.basePace * 1.6 : null);
  return {
    done, remaining, slots: slots.length, perSlot, projectedEnd,
    pct: tr.total ? Math.min(100, Math.round(done / tr.total * 100)) : 0,
    strained: !!(comfort && tr.anchor === 'deadline' && perSlot > comfort),
    comfort
  };
}

/* Rewrite the future. Called after every log, and by Redistribute. */
function recomputeTrack(w, tr) {
  if (tr.ripple === 'fixed' || tr.anchor === 'none') { relabelLinked(w, tr); return; }
  const slots = openSlots(w, tr);
  if (!slots.length) return;
  const remaining = Math.max(0, tr.total - trackDone(w, tr));

  if (tr.anchor === 'deadline' && tr.ripple === 'smooth') {
    /* Same dates, new amounts. */
    let acc = 0, given = 0;
    const per = remaining / slots.length;
    slots.forEach((t, i) => {
      acc += per;
      let take = Math.round(acc) - given;
      if (i === slots.length - 1) take = remaining - given;
      take = Math.max(0, take);
      given += take;
      t.max = take;
      t.min = take ? Math.min(2, take) : 0;
    });
  } else {
    /* Amounts hold; the dates slide. Used by consume, and by pace anchors. */
    const amount = tr.anchor === 'pace' ? Math.max(1, tr.pace || 1) : null;
    let left = remaining, cursor = today(), i = 0;
    while (left > 0) {
      let t = slots[i];
      if (!t) {
        t = newTask({ title: tr.name + ' — next', category: tr.categories[0] || '',
                      types:['target','streak'], streak:true, auto:true });
        w.tasks.push(t);
        slots.push(t);
      }
      const take = Math.min(left, amount || t.planMax || t.max || 1);
      t.max = take;
      t.min = Math.min(2, take);
      t.date = cursor;
      cursor = addDays(cursor, 1);
      left -= take;
      i++;
      if (i > 2000) break;   /* safety */
    }
    /* Anything past the finish is surplus — getting ahead removed it. */
    slots.slice(i).forEach(t => {
      if (t.link || t.auto) { t.archived = true; t.date = ''; }
      else { t.max = 0; t.min = 0; }
    });
    w.tasks = w.tasks.filter(t => !t.archived);
  }
  relabelLinked(w, tr);
}

/* Campaign tasks carry unit positions, so their targets are re-labelled
   ("Ch. 63 – Ch. 67") and their hook re-pulled from the chapter bands. */
function relabelLinked(w, tr) {
  const linked = trackTasks(w, tr).filter(t => t.link).sort((a,b) => (a.date||'9999') < (b.date||'9999') ? -1 : 1);
  if (!linked.length) return;
  let cursor = 0;
  linked.forEach(t => {
    const l = w.progress.log[t.id];
    const amount = l ? (l.units || 0) : (t.max || 0);
    const from = cursor, to = Math.max(cursor, cursor + amount - 1);
    t.link = { book: t.link.book, from, to };
    if (amount > 0) {
      const a = unitLabel(w, from), b = unitLabel(w, to);
      t.range = a + (a !== b ? ' – ' + b : '');
      if (!t.hookEdited) t.hook = baitFor(w, from, to).t;
      const bk = bookAt(w, from);
      if (bk) t.category = bk.title;
    }
    cursor += amount;
  });
  w.progress.unitsDone = Math.min(totalUnits(w), linked.reduce((s,t) => {
    const l = w.progress.log[t.id];
    return s + (l && l.result !== 'skip' ? (l.units || 0) : 0);
  }, 0));
}

/* One session per day between today and the deadline: adds days when the
   finish moves out, so a longer runway actually lightens each day. */
function fitSlotsToDeadline(w, tr) {
  if (tr.anchor !== 'deadline' || !tr.endDate) return;
  const t0 = today();
  const days = Math.max(1, daysBetween(t0, tr.endDate) + 1);
  const slots = openSlots(w, tr);
  for (let i = slots.length; i < days; i++) {
    const t = newTask({ title: tr.name + ' — session', category: tr.categories[0] || '',
                        types:['target','streak'], streak:true, auto:true });
    w.tasks.push(t); slots.push(t);
  }
  slots.forEach((t, i) => { t.date = addDays(t0, Math.min(i, days - 1)); });
}

function recomputeAll(w) { (w.tracks || []).forEach(tr => recomputeTrack(w, tr)); }

/* What each button would do to the plan — shown on the button itself. */
function tierImpact(w, task, amount) {
  const tr = trackFor(w, task);
  if (!tr || tr.ripple === 'fixed' || tr.anchor === 'none') return '';
  const already = w.progress.log[task.id];
  const doneAfter = trackDone(w, tr) - (already ? (already.units || 0) : 0) + amount;
  const remaining = Math.max(0, tr.total - doneAfter);
  if (!remaining) return 'finishes it';
  if (tr.anchor === 'pace' || tr.ripple === 'consume') {
    const per = tr.anchor === 'pace' ? Math.max(1, tr.pace || 1) : (task.planMax || task.max || 1);
    return 'ends ' + fmtDay(addDays(today(), Math.max(0, Math.ceil(remaining / per) - 1)));
  }
  const others = openSlots(w, tr).filter(t => t.id !== task.id).length;
  if (!others) return 'last one';
  const per = remaining / others;
  /* Spread over many days the difference is small, so show enough decimals
     that the three buttons actually read differently. */
  return per.toFixed(others > 12 ? 2 : 1) + '/day left';
}

/* Repeating tasks lay their own next egg when logged. */
function spawnRepeat(w, task) {
  if (!hasType(task, 'repeating') || !task.repeat || !task.repeat.freq || !task.date) return null;
  const r = task.repeat;
  let next;
  if (r.freq === 'daily') next = addDays(task.date, 1);
  else if (r.freq === 'weekly') next = addDays(task.date, 7);
  else if (r.freq === 'everyN') next = addDays(task.date, Math.max(1, r.n || 2));
  else if (r.freq === 'weekdays') {
    next = addDays(task.date, 1);
    while ([0,6].includes(parseISO(next).getDay())) next = addDays(next, 1);
  }
  if (!next) return null;
  if ((w.tasks || []).some(t => t.repeatOf === task.id && t.date === next)) return null;
  const copy = newTask(Object.assign({}, task, {
    id: undefined, date: next, repeatOf: task.id, added: Date.now()
  }));
  copy.id = newTask().id;
  w.tasks.push(copy);
  return copy;
}

/* On first run the shipped campaign becomes one deadline-anchored track. */
function migrateTracks(w) {
  (w.tasks || []).forEach(t => {
    if (!t.types) t.types = t.link ? ['target','streak'] : (t.streak ? ['streak'] : []);
    if (t.link && !t.types.includes('target')) t.types.push('target');
    if (t.planMax === undefined) t.planMax = t.max || null;
  });
  if (w.tracks) return;
  const linked = (w.tasks || []).filter(t => t.link);
  if (!linked.length) { w.tracks = []; return; }
  const total = totalUnits(w);
  w.tracks = [ newTrack({
    id: 'tr_main', name: w.name + ' campaign',
    categories: [...new Set(linked.map(t => t.category).filter(Boolean))],
    total, mode:'count', anchor:'deadline',
    endDate: w.end || linked[linked.length - 1].date,
    pace: Math.round(total / Math.max(1, linked.length)),
    ripple:'smooth',
    basePace: total / Math.max(1, linked.length)
  }) ];
}
/* ============================================================
   SCREENS
   Rules followed here:
   · one <h1> per screen, headings never skip a level
   · every control has a text name; emoji are decoration only
   · state is never carried by colour alone — there is always a word
   · progress bars expose their value to assistive tech
   ============================================================ */

const RARITY_LABEL = { common:'Common', rare:'Rare', epic:'Epic', legendary:'Legendary' };

function taskTiers(t, log) {
  const hasNums = t.min || t.max;
  if (!hasNums) {
    const on = !!(log && log.result === 'full');
    return `<div class="tiers" style="grid-template-columns:1fr 1fr">
      <button class="tier" data-log="full" data-task-id="${t.id}" data-units="0" aria-pressed="${on}"
        aria-label="Log ${esc(t.title)} as done, 20 ${esc(W.xpName)}${on ? ' — already logged' : ''}">
        <b>Done</b><span class="pay">+20</span></button>
      <button class="tier boss" data-log="boss" data-task-id="${t.id}" data-units="0" aria-pressed="${!!(log && log.result === 'boss')}"
        aria-label="Log ${esc(t.title)} as boss mode, 30 ${esc(W.xpName)} and guaranteed loot">
        <b>Boss</b><span class="pay">+30 · loot</span></button></div>`;
  }
  const base = t.max || t.min || 1;
  const amounts = { min: t.min || Math.min(2, base), full: base, boss: base + 3 };
  return `<div class="tiers">${['min','full','boss'].map(k => {
    const p = PAYOUT[k], on = !!(log && log.result === k), amt = amounts[k];
    const name = `${p.label} for ${t.title}: ${amt} ${W.unitPlural}, ${p.xp} ${W.xpName}${k === 'boss' ? ', guaranteed loot' : ''}${on ? ' — logged' : ''}`;
    const impact = tierImpact(W, t, amt);
    return `<button class="tier${k === 'boss' ? ' boss' : ''}" data-log="${k}" data-task-id="${t.id}" data-units="${amt}"
      aria-pressed="${on}" aria-label="${esc(name + (impact ? '. Afterwards: ' + impact : ''))}">
      <b>${p.label.split(' ')[0]}</b><small>${amt} ${esc(W.unitPlural)}</small>
      <span class="pay">+${p.xp}${k === 'boss' ? ' · loot' : ''}</span>
      ${impact ? `<span class="impact">${esc(impact)}</span>` : ''}</button>`;
  }).join('')}</div>`;
}

function taskCard(t, sec, hero) {
  const show = k => (sec.fields || []).includes(k);
  const log = W.progress.log[t.id];
  const ms = t.link ? nextMilestone() : null;
  const H = hero ? 'h1' : 'h3';
  const idAttr = hero ? ' id="screenTitle"' : '';
  const starred = (t.tags || []).includes('starred');
  const bits = [];
  if (show('date') && t.date) bits.push(fmtDay(t.date));
  if (show('category') && t.category) bits.push(esc(t.category));
  let out = `<article class="card${hero ? ' quest' : ''}"${hero ? '' : ' style="margin-top:10px"'}>
    ${bits.length || starred ? `<p class="date"><span class="eyebrow">${bits.join(' · ')}</span>
      ${starred ? '<span class="stars"><span aria-hidden="true">★</span><span class="sr-only">Starred</span></span>' : ''}</p>` : ''}
    <${H}${idAttr}${hero ? '' : ' style="font-size:19px;margin-bottom:8px"'}>${esc(t.title || 'Untitled')}</${H}>`;
  if (show('range') && (t.range || t.max)) {
    out += `<p class="target"><b>${esc(t.range || (t.max + ' ' + W.unitPlural))}</b>${t.range && t.max ? `<span>· ${t.max} ${esc(W.unitPlural)}</span>` : ''}</p>`;
  }
  if (show('tiers')) out += taskTiers(t, log);
  if (show('hook') && t.hook) {
    out += `<div class="bait"><div id="baitSlot_${t.id}">
      <button class="bait-btn" data-bait="${t.id}" aria-expanded="false" aria-controls="baitText_${t.id}">
        <span aria-hidden="true">🔥</span> <span>Peek at the hook</span></button></div></div>`;
  }
  const chips = [];
  if (show('how') && t.how) chips.push(`<span class="chip"><span aria-hidden="true">🎧</span> ${esc(t.how)}</span>`);
  if (show('payoff') && t.payoff) chips.push(`<span class="chip">Payoff: <b>${esc(t.payoff)}</b></span>`);
  if (show('tags') && (t.tags || []).length) chips.push(...t.tags.map(x => `<span class="chip">#${esc(x)}</span>`));
  if (chips.length) out += `<p class="meta">${chips.join('')}</p>`;
  if (show('notes') && t.notes) out += `<p style="margin:12px 0 0;color:var(--muted);font-size:14px">${esc(t.notes)}</p>`;
  if (show('momentum') && ms) {
    const pct = Math.round(Math.min(1, Math.max(0, (W.progress.unitsDone - (ms.prevIndex || 0)) / Math.max(1, ms.atIndex - (ms.prevIndex || 0) + 1))) * 100);
    out += `<div class="momentum">
      <p class="row"><span id="msLabel_${t.id}">Progress to ${esc(ms.name)}</span><b>${pct}%</b></p>
      <div class="bar" role="progressbar" aria-labelledby="msLabel_${t.id}" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    </div>`;
  }
  if (hero) {
    out += `<button class="escape" id="escapeBtn" aria-haspopup="dialog">
      <b><span aria-hidden="true">🧠</span> Attention is garbage tonight</b>
      <small>Ten minutes, whatever format works, and you may quit at ten. It still counts, and the streak holds.</small>
    </button>`;
  }
  out += `<p style="margin:14px 0 0"><button class="link" data-task="${t.id}" aria-haspopup="dialog">Edit this task</button></p>`;
  return out + '</article>';
}

function renderTrail() {

    const list = groups[cat];

    out += `<section aria-labelledby="realm${gi}">

      </div><ol class="trail">`;
    list.forEach(task => {
      const log = W.progress.log[task.id];

      out += `<li class="node ${isDone ? 'done' : ''} ${isToday ? 'today' : ''} ${isMissed ? 'missed' : ''}">

/* Lists with their bullets removed lose list semantics in Safari + VoiceOver,
   and the three win buttons should read as one group. Applied after every
   render so no template can forget it. */
function normalizeA11y(root) {
  root.querySelectorAll('ul.shelf,ol.trail,ul.loot-grid,ul.swatches,ul.tasklist')
      .forEach(l => l.setAttribute('role', 'list'));
  root.querySelectorAll('.tiers').forEach(t => {
    if (!t.getAttribute('role')) {
      t.setAttribute('role', 'group');
      t.setAttribute('aria-label', 'How much you got done');
    }
  });
}

    <span class="g" aria-hidden="true">${d.g}</span>${d.label}</button>`).join('');
  normalizeA11y($('main'));

/* ============================================================
   SYNC — local-first. The device is always the source of truth
   for what you just did; the server is how the other devices
   find out. Last write wins, by timestamp.
   ============================================================ */
/* Every method below is filled in later, once the Account object exists —
   this shell just holds the state that outlives any one sync call. */
const Sync = {
  status: 'off',      // off | idle | syncing | error
  lastAt: 0,
  _t: null,

  schedulePush() {
    if (!this.ready()) return;
    clearTimeout(this._t);
    this._t = setTimeout(async () => {
      try { this.status = 'syncing'; await this.push(S); this.status = 'idle'; }
      catch (e) { this.status = 'error'; }
    }, 1200);
  }
};

function save() {
  S.updatedAt = Date.now();
  Store.save(S);
  /* One on-device snapshot a day, so a bad edit is recoverable offline. */
  if (typeof writeLocalSnap === 'function' && S._snapDay !== today()) {
    S._snapDay = today();
    writeLocalSnap(JSON.parse(JSON.stringify(S)));
  }
  Sync.schedulePush();
}
/* Announcements go through one polite live region, so a screen reader
   hears "+20 XP" without the focus moving anywhere. */
function toast(msg) {
  const live = $('live');
  live.innerHTML = '';
  const el = document.createElement('p');
  el.className = 'toast'; el.textContent = msg;
  live.appendChild(el);
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => { if (el.parentNode) el.remove(); }, 4000);
}
function setErr(msg) {
  const e = $('formErr'); if (e) e.textContent = msg;
  toast(msg);
}

let lastFocus = null;
const FOCUSABLE = 'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])';

function closeSheet(restore) {
  const had = document.querySelector('.sheet,.drop');
  document.querySelectorAll('.veilbg,.sheet,.drop').forEach(n => n.remove());
  if (window._timer) { clearInterval(window._timer); window._timer = null; }
  window._paused = false;
  if (had && restore !== false && lastFocus && document.contains(lastFocus)) lastFocus.focus();
  lastFocus = null;
}

function mountDialog(node, cls) {
  node.setAttribute('role', cls === 'drop' ? 'alertdialog' : 'dialog');
  node.setAttribute('aria-modal', 'true');
  node.setAttribute('aria-labelledby', 'dialogTitle');
  document.body.appendChild(node);
  const first = node.querySelector('#dialogTitle') || node.querySelector(FOCUSABLE);
  if (first) first.focus();
}

/* Tab stays inside the open dialog; Escape closes it. */
document.addEventListener('keydown', e => {
  const dlg = document.querySelector('.sheet,.drop');
  if (!dlg) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
  if (e.key !== 'Tab') return;
  const items = [...dlg.querySelectorAll(FOCUSABLE)].filter(n => n.offsetParent !== null || n === document.activeElement);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === dlg || !dlg.contains(document.activeElement))) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
});

function openSheet(html, opener) {
  const keep = opener || (document.activeElement !== document.body ? document.activeElement : null);
  closeSheet(false);
  lastFocus = keep;
  const v = document.createElement('div');
  v.className = 'veilbg'; v.onclick = () => closeSheet();
  document.body.appendChild(v);
  const s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = '<div class="grab" aria-hidden="true"></div>' +
    '<div class="sheet-bar"><span></span><button class="close" data-close="1" aria-label="Close">' +
    '<span aria-hidden="true">\u2715</span></button></div>' +
    html.replace('<h2>', '<h2 id="dialogTitle" tabindex="-1">');
  normalizeA11y(s);
  mountDialog(s, 'sheet');
}

function openDrop(html) {
  const keep = document.activeElement !== document.body ? document.activeElement : null;
  closeSheet(false);
  lastFocus = keep;
  const d = document.createElement('div'); d.className = 'drop';
  d.innerHTML = `<div class="drop-card">${html.replace('<h2>', '<h2 id="dialogTitle" tabindex="-1">')}</div>`;
  d.addEventListener('click', e => { if (e.target === d) closeSheet(); });
  mountDialog(d, 'drop');
}

/* ------------------------------- logging ---------------------------------- */
const FLORA_FOR = { min:'sprout', full:'tree', boss:'bloom' };

/* A missed task gets an outcome instead of lingering. None of the three
   grant XP, currency or loot — nothing was actually done — but each one
   stops it sitting there un-logged and invisible forever.
     today — re-enters the plan as an open task, attempted today
     fold  — left exactly as the plan already silently handles it: still
             pending, still counted in what's left, just acknowledged
     skip  — logged as rested, the same non-punitive result the escape
             hatch uses; the campaign's unit labels move past it        */
function resolveMissed(w, task, choice) {
  const tr = trackFor(w, task);
  if (choice === 'today') {
    task.date = today();
  } else if (choice === 'skip') {
    w.progress.log[task.id] = { result:'skip', units:0, xp:0, coins:0, date:task.date, at:Date.now() };
  } else {
    task.missedAck = true;
  }
  if (tr) recomputeTrack(w, tr);
}

function logTask(taskId, kind, units) {
  const task = (W.tasks || []).find(x => x.id === taskId);
  if (!task) return;
  const when = task.date || today();
  const prev = W.progress.log[taskId];
  if (prev) {  /* re-logging replaces the earlier result, never punishes */
    W.progress.unitsDone = Math.max(0, W.progress.unitsDone - (prev.units || 0));
    W.progress.xp = Math.max(0, W.progress.xp - prev.xp);
    W.progress.coins = Math.max(0, W.progress.coins - prev.coins);
    W.progress.flora = W.progress.flora.filter(f => f.task !== taskId || f.milestone);
  }
  const p = PAYOUT[kind];
  /* Target tasks move their track forward; everything else is XP only. */
  units = hasType(task, 'target') ? Math.max(0, units) : 0;
  W.progress.log[taskId] = { result:kind, units, xp:p.xp, coins:p.coins, date:when, at:Date.now() };
  W.progress.unitsDone += units;
  W.progress.xp += p.xp;
  W.progress.coins += p.coins;
  W.progress.flora.push({ kind:FLORA_FOR[kind], date:when, task:taskId, seed:Math.floor(Math.random()*99999) });

  spawnRepeat(W, task);
  const tr = trackFor(W, task);
  if (tr) recomputeTrack(W, tr); else relabelLinked(W, { categories: [] });
  const found = checkMilestones();
  const drop = (!found && Math.random() < p.lootChance) ? grantLoot() : null;
  save(); paint();
  if (!found && drop) showDrop(drop);
  else if (!found) toast(`+${p.xp} ${W.xpName} · +${p.coins} ${W.currency}`);
}

function grantLoot(rarity) {
  const item = rollLoot(rarity);
  W.progress.loot.push(item);
  return item;
}
function showDrop(item) {
  openDrop(`<span class="g" aria-hidden="true">${item.g}</span>
    <p class="rarity">${RARITY_LABEL[item.r]} loot</p>
    <h2>${esc(item.n)}</h2>
    <p>Dropped into the hoard.</p>
    <button class="btn" data-close="1">Take it</button>`);
}

function checkMilestones() {
  const done = W.progress.unitsDone;
  const hit = (W.milestones || []).filter(m => !W.progress.achieved.includes(m.id) && m.atIndex <= done - 1);
  if (!hit.length) return null;
  let last = null;
  hit.forEach(m => {
    W.progress.achieved.push(m.id);
    W.progress.coins += 25;
    if (m.reward === 'biome' && m.biome && !W.progress.biomes.includes(m.biome)) W.progress.biomes.push(m.biome);
    if (m.reward === 'legendary' || m.reward === 'biome') {
      W.progress.flora.push({ kind:'legendary', date:today(), seed:Math.floor(Math.random()*99999), milestone:m.id });
    }
    last = m;
  });
  const item = grantLoot('legendary');
  save();
  setTimeout(() => openDrop(`<span class="g" aria-hidden="true">${last.reward === 'biome' ? '🏞️' : '🌳'}</span>
    <p class="rarity">Milestone reached</p>
    <h2>${esc(last.name)}</h2>
    <p>${esc(last.blurb)}</p>
    <p style="color:var(--glow-ink);font-size:13.5px;margin:-6px 0 18px">
      ${last.reward === 'biome' ? biomeName(last.biome) + ' unlocked' : 'A legendary tree takes root'} · +25 ${esc(W.currency)} · ${esc(item.n)} added to the hoard</p>
    <button class="btn" data-close="1">See the grove</button>`), 260);
  return last;
}

function sprintFace(mins) {
  const total = mins * 60;
  openSheet(`<h2 style="text-align:center">${mins}-minute sprint</h2>
    <div class="timer-face">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="bg" cx="50" cy="50" r="44"></circle>
        <circle class="fg" id="ring" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"></circle>
      </svg>
      <p class="t" id="clock" aria-hidden="true">${mins}:00</p>
    </div>
    <p class="sr-only" id="timerNote">${mins} minute sprint running. You can pause or stop at any time, and nothing is lost either way.</p>
    <button class="btn ghost" id="pauseSprint" aria-pressed="false">Pause</button>
    <button class="btn line" id="stopSprint">Stop — nothing lost</button>`);
  let left = total;
  const tick = () => {
    if (window._paused) return;
    left--;
    const m = Math.floor(left / 60), s = String(left % 60).padStart(2, '0');
    const clock = $('clock'); if (!clock) { clearInterval(window._timer); return; }
    clock.textContent = `${m}:${s}`;
    $('ring').setAttribute('stroke-dashoffset', String(276.5 * (1 - left / total)));
    if (left <= 0) {
      clearInterval(window._timer); window._timer = null;
      W.progress.sprints = (W.progress.sprints || 0) + 1;
      W.progress.sprintMinutes = (W.progress.sprintMinutes || 0) + mins;
      const xp = mins, coins = Math.round(mins / 2);
      W.progress.xp += xp; W.progress.coins += coins;
      const drop = Math.random() < (mins >= 25 ? .55 : .3) ? grantLoot() : null;
      save(); paint();
      if (drop) showDrop(drop); else { closeSheet(); toast(`Sprint complete. Plus ${xp} ${W.xpName} and ${coins} ${W.currency}.`); }
      try { navigator.vibrate && navigator.vibrate([120,60,120]); } catch (e) {}
    }
  };
  window._timer = setInterval(tick, 1000);
}

/* -------------------------------- events ---------------------------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-view],[data-sheet],[data-log],[data-missed],[data-theme],[data-world],[data-buy],[data-nudge],[data-sprint],[data-bait],#escapeBtn,#sprintBtn,#do_replan,#nw_go,#ar_go,#imp_go,#clearToday,#doExport,#stopSprint,#pauseSprint,#calmToggle,[data-close]');
  if (!el) return;

  if (el.dataset.close) { closeSheet(); return; }
  if (el.dataset.view) {
    view = el.dataset.view; paint();
    try { window.scrollTo(0,0); } catch (err) {}
    const h = document.querySelector('#screenTitle'); if (h) { h.setAttribute('tabindex','-1'); h.focus(); }
    return;
  }
  if (el.dataset.sheet) { openSheet(SHEETS[el.dataset.sheet](), el); return; }

  if (el.dataset.log) { logTask(el.dataset.taskId, el.dataset.log, parseInt(el.dataset.units, 10) || 0); return; }

  if (el.dataset.bait) {
    const t = (W.tasks || []).find(x => x.id === el.dataset.bait);
    if (!t) return;
    el.setAttribute('aria-expanded', 'true');
    $('baitSlot_' + t.id).innerHTML = `<div class="bait-open" id="baitText_${t.id}" tabindex="-1">
      <p class="eyebrow" style="margin:0 0 6px">The hook</p><p>${esc(t.hook)}</p></div>`;
    $('baitText_' + t.id).focus();
    return;
  }
  if (el.id === 'escapeBtn' || el.id === 'sprintBtn') { openSheet(SHEETS.sprint(), el); return; }
  if (el.id === 'pauseSprint') {
    window._paused = !window._paused;
    el.setAttribute('aria-pressed', String(!!window._paused));
    el.textContent = window._paused ? 'Resume' : 'Pause';
    toast(window._paused ? 'Sprint paused' : 'Sprint running');
    return;
  }
  if (el.id === 'calmToggle') {
    S.prefs = S.prefs || {};
    S.prefs.calm = !S.prefs.calm;
    save(); paint();
    openSheet(SHEETS.settings());
    toast(S.prefs.calm ? 'Motion reduced' : 'Motion back on');
    return;
  }
  if (el.dataset.sprint) { sprintFace(parseInt(el.dataset.sprint, 10)); return; }
  if (el.id === 'stopSprint') { closeSheet(); toast('Stopped. Streak untouched.'); return; }

  if (el.dataset.theme) { W.theme = el.dataset.theme; save(); closeSheet(); paint(); toast(THEMES[W.theme].name + ' theme applied'); return; }
  if (el.dataset.world) { S.activeId = el.dataset.world; W = S.worlds.find(w => w.id === S.activeId); save(); closeSheet(); view='tonight'; paint(); toast('Switched to ' + W.name); return; }

  if (el.dataset.buy) {
    const i = +el.dataset.buy, item = W.progress.shop[i];
    if (W.progress.coins < item.c) { toast(`${item.c - W.progress.coins} more ${W.currency}`); return; }
    W.progress.coins -= item.c;
    W.progress.claimed.push({ n:item.n, at:Date.now() });
    save(); paint(); toast(`Redeemed: ${item.n}. Go get it.`); return;
  }
  if (el.dataset.nudge) {
    const n = +el.dataset.nudge;
    W.progress.unitsDone = Math.max(0, Math.min(totalUnits(W), W.progress.unitsDone + n));
    checkMilestones(); save(); paint(); openSheet(SHEETS.position()); return;
  }
  if (el.id === 'do_replan') {
    const tr = W.tracks && W.tracks[0];
    const before = tr ? ((openSlots(W, tr).find(x => x.date === today()) || {}).max || 0) : null;
    recomputeAll(W);
    const after = tr ? ((openSlots(W, tr).find(x => x.date === today()) || {}).max || 0) : null;
    save(); closeSheet(); paint();
    toast(before !== null && before !== after
      ? `Redistributed — today now asks for ${after} ${W.unitPlural}`
      : 'Already up to date. Nothing needed to change.');
    return;
  }
  if (el.dataset.missed) {
    const task = (W.tasks || []).find(x => x.id === el.dataset.taskId);
    if (task) {
      resolveMissed(W, task, el.dataset.missed);
      save();
      toast(el.dataset.missed === 'today' ? 'Moved to today'
          : el.dataset.missed === 'skip' ? 'Let go — nothing lost'
          : 'Folded into the plan');
    }
    closeSheet(); paint();
    return;
  }

  if (el.id === 'nw_go') {
    const parts = $('nw_parts').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const m = l.split(','); return { name:(m[0]||'Part').trim(), units:Math.max(1, parseInt(m[1],10) || 10) };
    });
    const name = $('nw_name').value.trim(), start = $('nw_start').value, end = $('nw_end').value;
    if (!name || !start || !end || !parts.length) { setErr('Add a name, both dates, and at least one part.'); return; }
    if (end < start) { setErr('The end date has to come after the start date.'); return; }
    const w = makeWorld({ name, unit:$('nw_unit').value.trim() || 'chapter', currency:$('nw_cur').value.trim() || 'Coins',
                          theme:$('nw_theme').value, start, end, parts });
    indexDays(w); linkMilestones(w); migrateTasks(w); migrateTracks(w);
    S.worlds.push(w); S.activeId = w.id; W = w;
    save(); closeSheet(); view = 'tonight'; paint(); toast(`${name} begins.`); return;
  }
  if (el.id === 'ar_go') {
    const n = $('ar_n').value.trim(); if (!n) { setErr('Give the reward a name.'); return; }
    W.progress.shop.push({ g:$('ar_g').value || '🎁', n, c:Math.max(1, parseInt($('ar_c').value,10) || 25) });
    save(); closeSheet(); paint(); return;
  }
  if (el.id === 'clearToday') {
    const t = today();
    const ids = Object.keys(W.progress.log).filter(k => (W.progress.log[k].date || k) === t);
    if (!ids.length) { toast('Nothing logged today'); return; }
    ids.forEach(id => {
      const prev = W.progress.log[id];
      W.progress.unitsDone = Math.max(0, W.progress.unitsDone - (prev.units || 0));
      W.progress.xp = Math.max(0, W.progress.xp - prev.xp);
      W.progress.coins = Math.max(0, W.progress.coins - prev.coins);
      W.progress.flora = W.progress.flora.filter(f => f.task !== id || f.milestone);
      delete W.progress.log[id];
    });
    save(); closeSheet(); paint(); toast('Today cleared.'); return;
  }
  if (el.id === 'doExport') {

/* -------------------------------- boot ------------------------------------ */
function linkMilestones(w) {
  (w.milestones || []).forEach(m => {
    if (typeof m.atIndex === 'number') return;
    const off = bookOffset(w, m.book), bk = w.books.find(b => b.id === m.book);
    if (!bk) { m.atIndex = 0; return; }
    let found = bk.units - 1;
    for (let i = 0; i < bk.units; i++) if (unitLabel(w, off + i) === m.atUnit) { found = i; break; }
    m.atIndex = off + found;
  });
  let prev = 0;
  (w.milestones || []).sort((a,b) => a.atIndex - b.atIndex).forEach(m => { m.prevIndex = prev; prev = m.atIndex + 1; });
}

function seedMaasverse() {
  const w = JSON.parse(JSON.stringify(MAASVERSE_CAMPAIGN));
  w.progress = newProgress();
  w.progress.shop = DEFAULT_SHOP.map(s => ({...s}));
  indexDays(w); linkMilestones(w); migrateTasks(w); migrateTracks(w);
  return w;
}

(async function boot() {
  S = await Store.load();
  if (!S || !S.worlds || !S.worlds.length) {
    const m = seedMaasverse();
    S = { v:1, activeId:m.id, worlds:[m] };
    await Store.save(S);
  }
  W = S.worlds.find(w => w.id === S.activeId) || S.worlds[0];
  S.worlds.forEach(w => { if (!w.days[0] || w.days[0].fromGlobal === undefined) indexDays(w); linkMilestones(w); migrateTasks(w); migrateTracks(w); });
  paint();
  const health = (typeof storageHealth === 'function') ? storageHealth() : { ok:true };
  if (!health.ok) toast('Storage is blocked here — nothing will be saved');
  if (typeof Account !== 'undefined') Account.loadCfg();
  if (Sync.ready()) {
    const pulled = await Sync.reconcile();
    if (pulled) {
      S.worlds.forEach(w => { if (!w.days[0] || w.days[0].fromGlobal === undefined) indexDays(w); linkMilestones(w); migrateTasks(w); migrateTracks(w); });
      paint();
    }
  }
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && Sync.ready()) {
      const pulled = await Sync.reconcile();
      if (pulled) { S.worlds.forEach(w => linkMilestones(w)); paint(); }
    }
  });
})();

function toggleIn(arr, val) {
  const i = arr.indexOf(val);
  if (i < 0) arr.push(val); else arr.splice(i, 1);
  return arr;
}
function readTaskForm() {
  const g = k => { const el = $('tf_' + k); return el ? el.value.trim() : ''; };

    hook: g('hook'), how: g('how'), payoff: g('payoff'), notes: g('notes'),
