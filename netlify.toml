# OnWeGo — static site in /www, one function for cross-device sync.

[build]
  publish = "www"
  functions = "netlify/functions"
  command = "echo 'no build step — static files'"

# Fallback route in case path-based function routing isn't picked up.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
